name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 逻辑检查不碰网络，任何环境都要过
      - name: Offline self-check
        run: python scripts/selfcheck.py --offline

      # 联网检查会真下 PDF。S3 在部分 runner 上可能抖，
      # 失败不阻塞合并 —— 那是环境问题不是代码问题。
      - name: Network self-check
        continue-on-error: true
        run: python scripts/selfcheck.py
