name: 功能建议
description: 提出新功能或改进
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么
      description: 说场景比说方案更有用
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你想到的做法
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 上下文
      description: 你的领域、主题类型、卡在哪一步
    validations:
      required: false
